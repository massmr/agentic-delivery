workspace:
  name: la-kreme
  autonomy: full_until_production_pr
  staging_branch: develop
  production_branch: main
  max_concurrent_tickets: 1

jira:
  mode: mock
  base_url: https://your-domain.atlassian.net
  project_keys:
    - LK

github:
  mode: mock

# GitHub can also run in MCP mode. Ewokbot derives repository owners
# from each local git remote instead of asking for a global organization.
# github:
#   mode: mcp
#   mcp_server: github

# Railway can also run in MCP mode for deployment-state and service-url lookup:
# railway:
#   mode: mcp
#   staging_branch: develop
#   production_branch: main
#   mcp_server: railway

railway:
  mode: mock
  staging_branch: develop
  production_branch: main

mcp_policy:
  mode: read_only
  providers: {}
  servers: {}
  tools: {}

dev_runner:
  provider: opencode
  command: opencode
  args: []
  timeout_ms: 1800000
  env_var_names:
    - PATH
    - HOME
    - TMPDIR
    - TEMP
    - TMP
  max_attempts: 2

quality:
  default_profile: node

mcp_servers:
  atlassian:
    display_name: Atlassian MCP
    command: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.atlassian.com/v1/mcp/authv2
  github:
    display_name: GitHub MCP
    command: docker
    args:
      - run
      - -i
      - --rm
      - -e
      - GITHUB_PERSONAL_ACCESS_TOKEN
      - ghcr.io/github/github-mcp-server
    env_var_names:
      - GITHUB_PERSONAL_ACCESS_TOKEN

repos:
  - name: frontend
    url: git@github.com:your-org/frontend.git
    local_path: ../frontend
    default_branch: develop
    production_branch: main
    quality_profile: node
    hints:
      - frontend
      - ui
      - web
      - next
    staging_smoke_urls:
      - /
      - /health

  - name: api
    url: git@github.com:your-org/api.git
    local_path: ../api
    default_branch: develop
    production_branch: main
    quality_profile: node
    hints:
      - api
      - backend
      - server
      - database
    staging_smoke_urls:
      - /health
