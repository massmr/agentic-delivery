workspace:
  name: la-kreme
  autonomy: full_until_production_pr
  staging_branch: develop
  production_branch: main
  max_concurrent_tickets: 1

jira:
  mode: mock
  base_url: https://your-domain.atlassian.net
  project_keys:
    - LK

github:
  mode: mock
  organization: your-org

railway:
  mode: mock
  staging_branch: develop
  production_branch: main

dev_runner:
  provider: opencode
  command: opencode
  max_attempts: 2

quality:
  default_profile: node

mcp_servers:
  atlassian:
    display_name: Atlassian MCP
    command: npx
    args:
      - -y
      - mcp-remote
      - https://mcp.atlassian.com/v1/mcp/authv2

repos:
  - name: frontend
    url: git@github.com:your-org/frontend.git
    local_path: ../frontend
    default_branch: develop
    production_branch: main
    quality_profile: node
    hints:
      - frontend
      - ui
      - web
      - next
    staging_smoke_urls:
      - /
      - /health

  - name: api
    url: git@github.com:your-org/api.git
    local_path: ../api
    default_branch: develop
    production_branch: main
    quality_profile: node
    hints:
      - api
      - backend
      - server
      - database
    staging_smoke_urls:
      - /health
